{{- if and .Values.fluentBit .Values.fluentBit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fluentBit.configMapName | default "fluentbit-config" }}
  namespace: {{ include "cv.namespace" . }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Daemon                    Off
        Log_Level                 info

        # Persistent filesystem buffering
        storage.path              /fluent-bit/state/buffer
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 50M

    [INPUT]
        Name              tail
        Path              /var/log/commvault/Log_Files/*.log
        Exclude_Path      /var/log/commvault/Log_Files/*.bz2
        Tag               commvault.logs

        # Keep source filename in each record.
        # Gateway can map this to Loki structured metadata.
        Path_Key          log_file

        # Persistent tail position database
        DB                /fluent-bit/state/commvault.db
        DB.Sync           Normal
        DB.Locking        true

        Read_from_Head    false
        Refresh_Interval  5
        Rotate_Wait       30
        Skip_Long_Lines   On

        # Buffer log chunks on persistent storage
        storage.type      filesystem

    [FILTER]
        Name              record_modifier
        Match             commvault.*
        Record            cluster {{ .Values.fluentBit.cluster }}
        Record            tenant {{ .Values.fluentBit.tenant }}
        Record            environment {{ .Values.fluentBit.environment }}
        Record            component commserve

    [OUTPUT]
        Name              forward
        Match             commvault.*

        Host              {{ .Values.fluentBit.host }}
        Port              {{ .Values.fluentBit.port }}

        tls               On
        tls.verify        On
        tls.ca_file       /fluent-bit/mtls/ca.crt
        tls.crt_file      /fluent-bit/mtls/tls.crt
        tls.key_file      /fluent-bit/mtls/tls.key

        # Keep retrying during temporary gateway/network outages
        Retry_Limit       False
{{- end }}